name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.3
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze active Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            firebase/functions/package-lock.json
            firebase/custom_cloud_functions/package-lock.json

      - name: Install backend dependencies
        run: |
          npm ci --prefix firebase/functions
          npm ci --prefix firebase/custom_cloud_functions

      - name: Run backend syntax and contract checks
        run: npm run backend:ci
