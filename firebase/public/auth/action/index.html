<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>Expatlio account action</title>
    <style>
      :root {
        --background: #f2f2f7;
        --card: #ffffff;
        --text: #000000;
        --muted: rgba(60, 60, 67, 0.6);
        --border: #e5e5ea;
        --primary: #7430e8;
        --primary-pressed: #5f24c8;
        --danger: #ff383c;
        --success: #34c759;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "Segoe UI", Roboto, Arial, sans-serif;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 16px
          max(24px, env(safe-area-inset-bottom));
      }

      .panel {
        width: min(100%, 430px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 22px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: var(--primary);
        color: #ffffff;
        font-size: 24px;
        font-weight: 800;
      }

      .brand-name {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .status-icon {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        margin-bottom: 18px;
        border-radius: 18px;
        background: rgba(116, 48, 232, 0.1);
        color: var(--primary);
      }

      .status-icon[data-state="success"] {
        background: rgba(52, 199, 89, 0.12);
        color: var(--success);
      }

      .status-icon[data-state="error"] {
        background: rgba(255, 56, 60, 0.12);
        color: var(--danger);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 30px;
        line-height: 1.12;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 24px;
      }

      .reset-form {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 24px;
      }

      .reset-form[hidden] {
        display: none;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: 14px;
        font-weight: 650;
      }

      input {
        width: 100%;
        min-height: 52px;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 13px 15px;
        background: #ffffff;
        color: var(--text);
        font: inherit;
        font-size: 16px;
        outline: none;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(116, 48, 232, 0.12);
      }

      .field-error {
        min-height: 20px;
        color: var(--danger);
        font-size: 13px;
      }

      button,
      a.button {
        width: 100%;
        min-height: 52px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 16px;
        padding: 14px 18px;
        background: var(--primary);
        color: #ffffff;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      button:active,
      a.button:active {
        background: var(--primary-pressed);
      }

      .secondary {
        background: rgba(116, 48, 232, 0.1);
        color: var(--primary);
      }

      .secondary:active {
        background: rgba(116, 48, 232, 0.16);
      }

      .spinner {
        width: 22px;
        height: 22px;
        border: 3px solid rgba(116, 48, 232, 0.2);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="panel" aria-live="polite">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">E</div>
          <div class="brand-name">Expatlio</div>
        </div>

        <div id="statusIcon" class="status-icon" aria-hidden="true">
          <div class="spinner"></div>
        </div>
        <h1 id="title">Подтверждаем email</h1>
        <p id="message">Проверяем ссылку. Это займёт пару секунд.</p>

        <form id="resetForm" class="reset-form" hidden>
          <label>
            <span id="passwordLabel">Новый пароль</span>
            <input id="password" type="password" minlength="8" autocomplete="new-password" required>
          </label>
          <label>
            <span id="passwordConfirmLabel">Повторите пароль</span>
            <input id="passwordConfirm" type="password" minlength="8" autocomplete="new-password" required>
          </label>
          <div id="fieldError" class="field-error" role="alert"></div>
          <button id="resetButton" type="submit">Сохранить пароль</button>
        </form>

        <div class="actions">
          <button id="retryButton" class="secondary" type="button" hidden>
            Повторить
          </button>
          <button id="openAppButton" type="button" hidden>
            Открыть Expatlio
          </button>
        </div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/12.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.12.0/firebase-auth-compat.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var mode = params.get("mode");
        var actionCode = params.get("oobCode");
        var language = (params.get("lang") || "ru").toLowerCase()
          .indexOf("en") === 0 ? "en" : "ru";
        var copy = messages()[language];
        var fallbackAppUrl = mode === "resetPassword"
          ? "smalltalk://smalltalk.com/?passwordReset=1"
          : "smalltalk://smalltalk.com/?emailVerified=1";
        var apiKey = params.get("apiKey") ||
          "AIzaSyBRCxuTmxzNF973BXtuR_JT_MraioaHH34";
        var appUrl = safeAppUrl(params.get("continueUrl"));

        var title = document.getElementById("title");
        var message = document.getElementById("message");
        var statusIcon = document.getElementById("statusIcon");
        var openAppButton = document.getElementById("openAppButton");
        var retryButton = document.getElementById("retryButton");
        var resetForm = document.getElementById("resetForm");
        var password = document.getElementById("password");
        var passwordConfirm = document.getElementById("passwordConfirm");
        var fieldError = document.getElementById("fieldError");
        var resetButton = document.getElementById("resetButton");

        document.documentElement.lang = language;
        openAppButton.textContent = copy.openApp;
        retryButton.textContent = copy.retry;
        document.getElementById("passwordLabel").textContent = copy.password;
        document.getElementById("passwordConfirmLabel").textContent =
          copy.passwordConfirm;
        resetButton.textContent = copy.savePassword;
        openAppButton.addEventListener("click", openApp);
        retryButton.addEventListener("click", verifyResetLink);
        resetForm.addEventListener("submit", submitNewPassword);

        if (!actionCode || (mode !== "verifyEmail" && mode !== "resetPassword")) {
          showError(copy.invalidTitle, copy.invalidMessage);
          return;
        }

        firebase.initializeApp({
          apiKey: apiKey,
          authDomain: "smalltalk-2109b.firebaseapp.com",
          projectId: "smalltalk-2109b",
          appId: "1:1024626146715:web:63189c0ffd3746bc6bf53e",
        });

        if (mode === "resetPassword") {
          verifyResetLink();
          return;
        }

        title.textContent = copy.checkingEmail;
        message.textContent = copy.checkingMessage;
        firebase.auth().applyActionCode(actionCode)
          .then(function () {
            showSuccess(copy.emailDoneTitle, copy.emailDoneMessage);
            if (isMobileBrowser()) {
              window.setTimeout(openApp, 900);
            }
          })
          .catch(function () {
            showError(copy.emailErrorTitle, copy.emailErrorMessage);
          });

        function showResetForm() {
          retryButton.hidden = true;
          openAppButton.hidden = true;
          statusIcon.innerHTML = keyIcon();
          title.textContent = copy.resetTitle;
          message.textContent = copy.resetMessage;
          resetForm.hidden = false;
          password.focus();
        }

        function verifyResetLink() {
          retryButton.hidden = true;
          openAppButton.hidden = true;
          statusIcon.dataset.state = "";
          statusIcon.innerHTML = '<div class="spinner"></div>';
          title.textContent = copy.checkingReset;
          message.textContent = copy.checkingMessage;
          firebase.auth().verifyPasswordResetCode(actionCode)
            .then(showResetForm)
            .catch(handleResetError);
        }

        function handleResetError(error) {
          if (error && error.code === "auth/expired-action-code") {
            showError(copy.expiredTitle, copy.expiredMessage);
            return;
          }
          if (error && error.code === "auth/invalid-action-code") {
            showError(copy.invalidResetTitle, copy.invalidResetMessage);
            return;
          }
          showRetry(copy.retryErrorTitle, copy.retryErrorMessage);
        }

        function isInvalidOrExpiredActionCode(error) {
          return error && (
            error.code === "auth/invalid-action-code" ||
            error.code === "auth/expired-action-code"
          );
        }

        function submitNewPassword(event) {
          event.preventDefault();
          fieldError.textContent = "";
          if (password.value.length < 8) {
            fieldError.textContent = copy.passwordShort;
            return;
          }
          if (password.value !== passwordConfirm.value) {
            fieldError.textContent = copy.passwordMismatch;
            return;
          }

          resetButton.disabled = true;
          resetButton.textContent = copy.saving;
          firebase.auth().confirmPasswordReset(actionCode, password.value)
            .then(function () {
              resetForm.hidden = true;
              showSuccess(copy.resetDoneTitle, copy.resetDoneMessage);
            })
            .catch(function (error) {
              resetButton.disabled = false;
              resetButton.textContent = copy.savePassword;
              if (error && (
                error.code === "auth/weak-password" ||
                error.code === "auth/password-does-not-meet-requirements"
              )) {
                fieldError.textContent = copy.passwordWeak;
                return;
              }
              if (isInvalidOrExpiredActionCode(error)) {
                handleResetError(error);
                return;
              }
              fieldError.textContent = copy.retryErrorMessage;
            });
        }

        function showSuccess(nextTitle, nextMessage) {
          retryButton.hidden = true;
          statusIcon.dataset.state = "success";
          statusIcon.innerHTML = checkIcon();
          title.textContent = nextTitle;
          message.textContent = nextMessage;
          openAppButton.hidden = false;
        }

        function showError(nextTitle, nextMessage) {
          resetForm.hidden = true;
          retryButton.hidden = true;
          statusIcon.dataset.state = "error";
          statusIcon.innerHTML = errorIcon();
          title.textContent = nextTitle;
          message.textContent = nextMessage;
          openAppButton.hidden = false;
        }

        function showRetry(nextTitle, nextMessage) {
          resetForm.hidden = true;
          statusIcon.dataset.state = "error";
          statusIcon.innerHTML = errorIcon();
          title.textContent = nextTitle;
          message.textContent = nextMessage;
          retryButton.hidden = false;
          openAppButton.hidden = true;
        }

        function openApp() {
          window.location.assign(appUrl);
        }

        function safeAppUrl(rawValue) {
          try {
            var url = new URL(rawValue || fallbackAppUrl);
            var allowedQuery = mode === "resetPassword"
              ? url.searchParams.get("passwordReset") === "1"
              : url.searchParams.get("emailVerified") === "1";
            if (
              url.protocol === "smalltalk:" &&
              url.hostname === "smalltalk.com" &&
              url.pathname === "/" &&
              Array.from(url.searchParams.keys()).length === 1 &&
              allowedQuery
            ) {
              return url.toString();
            }
          } catch (error) {
            return fallbackAppUrl;
          }
          return fallbackAppUrl;
        }

        function isMobileBrowser() {
          return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        }

        function messages() {
          return {
            ru: {
              openApp: "Открыть Expatlio",
              retry: "Повторить",
              checkingEmail: "Подтверждаем email",
              checkingReset: "Проверяем ссылку",
              checkingMessage: "Это займёт пару секунд.",
              invalidTitle: "Ссылка не распознана",
              invalidMessage: "Проверьте письмо и откройте актуальную ссылку.",
              emailDoneTitle: "Email подтверждён",
              emailDoneMessage: "Адрес подтверждён. Вернитесь в приложение.",
              emailErrorTitle: "Не удалось подтвердить email",
              emailErrorMessage: "Ссылка уже использована или срок действия истёк.",
              resetTitle: "Новый пароль",
              resetMessage: "Введите новый пароль длиной не менее 8 символов.",
              password: "Новый пароль",
              passwordConfirm: "Повторите пароль",
              passwordShort: "Пароль должен содержать не менее 8 символов.",
              passwordWeak: "Пароль не соответствует требованиям безопасности.",
              passwordMismatch: "Пароли не совпадают.",
              savePassword: "Сохранить пароль",
              saving: "Сохраняем…",
              resetDoneTitle: "Пароль изменён",
              resetDoneMessage: "Теперь можно войти с новым паролем.",
              expiredTitle: "Срок ссылки истёк",
              expiredMessage: "Запросите новое письмо для сброса пароля.",
              invalidResetTitle: "Ссылка уже недействительна",
              invalidResetMessage: "Запросите новое письмо для сброса пароля.",
              retryErrorTitle: "Не удалось проверить ссылку",
              retryErrorMessage: "Проверьте интернет и повторите попытку.",
            },
            en: {
              openApp: "Open Expatlio",
              retry: "Try again",
              checkingEmail: "Confirming email",
              checkingReset: "Checking the link",
              checkingMessage: "This will only take a moment.",
              invalidTitle: "Invalid link",
              invalidMessage: "Open the latest link from your email.",
              emailDoneTitle: "Email confirmed",
              emailDoneMessage: "Your email is confirmed. Return to the app.",
              emailErrorTitle: "Could not confirm email",
              emailErrorMessage: "The link was already used or has expired.",
              resetTitle: "New password",
              resetMessage: "Enter a new password with at least 8 characters.",
              password: "New password",
              passwordConfirm: "Confirm password",
              passwordShort: "Use at least 8 characters.",
              passwordWeak: "This password does not meet the security requirements.",
              passwordMismatch: "Passwords do not match.",
              savePassword: "Save password",
              saving: "Saving…",
              resetDoneTitle: "Password changed",
              resetDoneMessage: "You can now sign in with your new password.",
              expiredTitle: "Link expired",
              expiredMessage: "Request a new password reset email.",
              invalidResetTitle: "Link is no longer valid",
              invalidResetMessage: "Request a new password reset email.",
              retryErrorTitle: "Could not check the link",
              retryErrorMessage: "Check your connection and try again.",
            },
          };
        }

        function checkIcon() {
          return '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        }

        function keyIcon() {
          return '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 7a4 4 0 1 1-7.4 2.1L3 13.7V17h3v3h3l4.9-4.6A4 4 0 0 1 15 7Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        }

        function errorIcon() {
          return '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 8v5M12 17h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        }
      })();
    </script>
  </body>
</html>
