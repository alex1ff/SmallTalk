analyzer:
  exclude:
    - node_modules/**

# Correctness-focused baseline for a codebase that still contains generated-style
# widgets. Style migration is kept separate so it cannot hide runtime findings.
linter:
  rules:
    - avoid_empty_else
    - avoid_relative_lib_imports
    - avoid_shadowing_type_parameters
    - avoid_web_libraries_in_flutter
    - collection_methods_unrelated_type
    - no_duplicate_case_values
    - no_logic_in_create_state
    - prefer_void_to_null
    - test_types_in_equals
    - throw_in_finally
    - valid_regexps
